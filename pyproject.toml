[project]
name = "asw-sfqs"
version = "0.1.0"
description = "Qingdao ocean freight quotation workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.3",
  "pydantic==2.14.0",
  "pydantic-settings==2.16.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.13.1", "pillow==13.0.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
